  <div id="root"></div>
  <script>
    // ===== HOTFIX: Import button anti-double-click =====
    (function() {
      var importLocked = false;
      document.addEventListener('click', function(e) {
        var btn = e.target.closest('button');
        if (!btn) return;
        var text = btn.textContent.trim();
        if (text === 'Confirm Import' && !importLocked) {
          importLocked = true;
          btn.disabled = true;
          btn.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" style="animation:spin 1s linear infinite;display:inline-block;vertical-align:middle;margin-right:6px"><circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="3" fill="none" stroke-dasharray="60" stroke-dashoffset="20"/></svg>Importing...';
          btn.style.opacity = '0.7';
          var cancelBtn = btn.parentElement.querySelector('button:not([disabled])');
          if (cancelBtn && cancelBtn.textContent.trim() === 'Cancel') {
            cancelBtn.disabled = true;
            cancelBtn.style.opacity = '0.5';
          }
          setTimeout(function() { importLocked = false; }, 30000);
        }
      });
      var style = document.createElement('style');
      style.textContent = '@keyframes spin{to{transform:rotate(360deg)}}';
      document.head.appendChild(style);
    })();

    // ===== HOTFIX: Enhanced delete confirmation =====
    (function() {
      var origConfirm = window.confirm;
      window.confirm = function(msg) {
        if (msg === 'Delete?') {
          return origConfirm('WARNING: This will PERMANENTLY DELETE this item and ALL linked products/brands.\n\nThis action cannot be undone.\n\nProceed with deletion?');
        }
        return origConfirm(msg);
      };
    })();
  </script>
